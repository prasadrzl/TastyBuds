# TastyBuds — build configuration (non-secret). Values are read in
# core/data/build.gradle.kts and exposed via BuildConfig. Edit per environment.
#
# API base URL. 10.0.2.2 is the Android emulator's alias for the host machine's
# localhost. For a physical device, use your machine's LAN IP, e.g.
# http://192.168.1.20:8080/api/v1/
API_BASE_URL=http://10.0.2.2:8080/api/v1/

# OkHttp connect/read/write timeout, in seconds.
NETWORK_TIMEOUT_SECONDS=30
