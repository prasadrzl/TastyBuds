services:
  postgres:
    image: postgres:16-alpine
    container_name: tastybuds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tastybuds
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tastybuds
    ports:
      - "5433:5432"
    volumes:
      - tastybuds_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  tastybuds_pgdata:
