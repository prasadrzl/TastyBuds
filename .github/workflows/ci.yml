name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Generate aggregated coverage report
        if: always()
        run: ./gradlew jacocoAggregatedReport --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/aggregated/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: build/reports/jacoco/aggregated/jacoco.xml
          flags: unittests
          fail_ci_if_error: false
          # Public repos work without a token; add CODECOV_TOKEN as a repo secret if private.
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Post coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/aggregated/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code Coverage (logic layer)
          min-coverage-overall: 75
          min-coverage-changed-files: 75
